<template>
    <lightning-card title="Member Eligibility Verification" icon-name="standard:contact">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <lightning-input
                label="Member ID"
                value={memberId}
                onchange={handleMemberIdChange}
                required
                disabled={isLoading}
            ></lightning-input>

            <div class="slds-m-top_small">
                <lightning-button
                    variant="brand"
                    label="Verify Eligibility"
                    onclick={handleVerify}
                    disabled={isVerifyDisabled}
                ></lightning-button>
            </div>

            <template if:true={isLoading}>
                <div class="slds-m-top_medium slds-align_absolute-center" role="status">
                    <lightning-spinner alternative-text="Verifying eligibility" size="small"></lightning-spinner>
                </div>
            </template>

            <template if:true={showError}>
                <div class="slds-m-top_medium slds-text-color_error" role="alert">
                    <lightning-icon
                        icon-name="utility:error"
                        variant="error"
                        size="x-small"
                        class="slds-m-right_x-small"
                    ></lightning-icon>
                    <span>{errorMessage}</span>
                </div>
            </template>

            <template if:true={showResult}>
                <div class="slds-m-top_medium">
                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                        <lightning-icon
                            icon-name={statusIconName}
                            variant={statusIconVariant}
                            size="small"
                            class="slds-m-right_x-small"
                        ></lightning-icon>
                        <span class={statusTextClass}>{statusLabel}</span>
                    </div>

                    <p class="slds-m-bottom_x-small">
                        <strong>Member:</strong> {result.memberName} ({result.memberId})
                    </p>
                    <p class="slds-m-bottom_x-small">
                        <strong>Reason:</strong> {result.reason}
                    </p>
                    <p class="slds-m-bottom_x-small">
                        <strong>Evaluation Date:</strong> {result.evaluationDate}
                    </p>

                    <template if:true={hasCoverageDetails}>
                        <p class="slds-m-bottom_x-small">
                            <strong>Coverage Type:</strong> {result.coverageType}
                        </p>
                        <p class="slds-m-bottom_x-small">
                            <strong>Effective Date:</strong> {result.effectiveDate}
                        </p>
                        <p class="slds-m-bottom_x-small">
                            <strong>Termination Date:</strong> {result.terminationDate}
                        </p>
                    </template>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
